<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCV Checker (95%)</title>

<style>
body {
  font-family: -apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  margin: 16px;
}
h1 { font-size: 20px; margin-bottom: 6px; }
.muted { color: #666; font-size: 13px; margin-bottom: 12px; }
textarea {
  width: 100%;
  height: 220px;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 13px;
  padding: 10px;
  box-sizing: border-box;
}
button { padding: 8px 12px; font-size: 14px; margin: 8px 6px 8px 0; }
details {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 10px 12px;
  margin: 10px 0;
}
summary { cursor: pointer; font-weight: 600; }
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}
th, td {
  border-bottom: 1px solid #eee;
  padding: 6px;
  font-size: 13px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border: 1px solid #ccc;
  border-radius: 999px;
  font-size: 12px;
  margin-left: 6px;
}
.yes { font-weight: 700; }
.na { color: #888; }
</style>
</head>

<body>

<h1>RCV Checker (95%)</h1>
<p class="muted">
Paste chart labs. RCV = |%Δ| &gt; RCV. Trend = longitudinal pattern only.
</p>

<textarea id="input"></textarea><br>
<button onclick="analyze()">Analyze</button>
<button onclick="clearAll()">Clear</button>

<div id="output"></div>

<script>
/* =======================
   RCV TABLE (95%)
   ======================= */
const RCV = {
  WBC: 32.4,
  HGB: 6.8,
  HCT: 7.0,
  RBC: 7.5,
  MCV: 3.5,
  PLT: 24.5,
  NA: 1.4,
  K: 14.1,
  CL: 2.5,
  CO2: 8.9,
  HCO3: 8.9,
  CR: 15.7,
  CREAT: 15.7,
  CREATININE: 15.7,
  GLUCOSE: 16.5
};

const NOISE_FLOOR = 1.0; // %

// =======================
// Utility
// =======================
function norm(s) {
  return s.trim().toUpperCase().replace(/\s+/g, " ");
}

function fmtDate(d) {
  const m = d.match(/^([A-Z]{3})\s+(\d{1,2})$/);
  if (!m) return d;
  return m[2].padStart(2,"0") + m[1];
}

function pct(newV, oldV) {
  if (oldV === 0) return null;
  return (newV - oldV) / oldV * 100;
}

// =======================
// Parsing
// =======================
function parseLine(line) {
  const nameMatch = line.match(/^([A-Za-z][A-Za-z0-9\s\/\-]+?)\s+(?=[HL]?\s*\d|\()/);
  const analyte = norm(nameMatch ? nameMatch[1] : line.split(/\s+/)[0]);

  const re = /(?:\b[HL]\b\s*)?([-+]?\d+(?:\.\d+)?)\s*\(\s*([A-Z]{3}\s+\d{1,2})\s*\)/g;
  const pts = [];
  let m;
  while ((m = re.exec(line.toUpperCase())) !== null) {
    pts.push({ value: parseFloat(m[1]), date: m[2] });
  }
  return pts.length ? { analyte, pts } : null;
}

// =======================
// Trend Analyzer
// =======================
function trendAnalyze(values, analyte) {
  if (values.length < 3) return "INSUFFICIENT";

  const deltas = [];
  for (let i = 0; i < values.length - 1; i++) {
    const d = pct(values[i], values[i+1]);
    if (d === null || Math.abs(d) < NOISE_FLOOR) deltas.push(0);
    else deltas.push(Math.sign(d));
  }

  const nonZero = deltas.filter(x => x !== 0);
  const net = pct(values[0], values[values.length - 1]);
  const netSign = net === null || Math.abs(net) < NOISE_FLOOR ? 0 : Math.sign(net);

  if (nonZero.length === 0) return "STABLE";

  if (nonZero.every(x => x === nonZero[0])) {
    return nonZero[0] === 1 ? "MONOTONIC ↑" : "MONOTONIC ↓";
  }

  let run = 1;
  for (let i = 1; i < nonZero.length; i++) {
    if (nonZero[i] === nonZero[i-1]) run++;
    else run = 1;
    if (run >= 2 && netSign === nonZero[i]) {
      return netSign === 1 ? "SUSTAINED ↑" : "SUSTAINED ↓";
    }
  }

  const rcv = RCV[analyte] ?? null;
  if (rcv && Math.abs(net) < rcv / 2) return "STABLE";

  return "VARIABLE";
}

// =======================
// Main
// =======================
function analyze() {
  const out = document.getElementById("output");
  out.innerHTML = "";

  const lines = document.getElementById("input").value.split(/\n/).filter(l => l.trim());
  for (const line of lines) {
    const parsed = parseLine(line);
    if (!parsed) continue;

    const { analyte, pts } = parsed;
    const values = pts.map(p => p.value);
    const rcv = RCV[analyte] ?? null;

    let rcvFlag = "NO";
    let rcvHit = "";

    if (rcv) {
      for (let i = 0; i < values.length - 1; i++) {
        const d = pct(values[i], values[i+1]);
        if (d !== null && Math.abs(d) > rcv) {
          rcvFlag = "YES";
          rcvHit = ` (${fmtDate(pts[i+1].date)}→${fmtDate(pts[i].date)})`;
          break;
        }
      }
    } else {
      rcvFlag = "NA";
    }

    const trend = trendAnalyze(values, analyte);

    const box = document.createElement("details");
    box.innerHTML = `
      <summary>${analyte}
        <span class="badge">RCV ${rcv ? "±"+rcv+"%" : "NA"}</span>
        <span class="badge">n=${values.length}</span>
      </summary>
      <div style="margin-top:8px;font-size:13px;">
        RCV: <b>${rcvFlag}${rcvHit}</b><br>
        Trend: <b>${trend}</b>
      </div>
    `;
    out.appendChild(box);
  }
}

function clearAll() {
  document.getElementById("input").value = "";
  document.getElementById("output").innerHTML = "";
}
</script>

</body>
</html>
