<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCV Checker</title>
<meta name="description" content="Is a change in a lab result real? Reference change values from EFLM biological variation data, with caveats and cross-lab checks. English, français, 한국어.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <h1 data-i18n="title">RCV Checker</h1>
    <p data-i18n="tagline"></p>
  </div>
  <div id="lang" class="lang" role="group" aria-label="Language / Langue / 언어">
    <button type="button" data-lang="en" lang="en">EN</button>
    <button type="button" data-lang="fr" lang="fr">FR</button>
    <button type="button" data-lang="ko" lang="ko">한국어</button>
  </div>
</header>

<main>
  <section class="card inputcard">
    <label for="input" class="label" data-i18n="inputLabel"></label>
    <textarea id="input" spellcheck="false" autocomplete="off" data-i18n-ph="placeholder"></textarea>
    <div class="controls">
      <div class="btns">
        <button type="button" id="analyze" class="primary" data-i18n="analyze"></button>
        <button type="button" id="example" data-i18n="exampleBtn"></button>
        <button type="button" id="clear" class="ghost" data-i18n="clear"></button>
      </div>
      <div class="opts">
        <label><span data-i18n="conf"></span><select id="conf"></select></label>
        <label><span data-i18n="order"></span><select id="order"></select></label>
      </div>
    </div>
    <p class="hint" data-i18n="formatHint"></p>
  </section>

  <section id="summary" class="summary" aria-live="polite"></section>
  <section id="alerts" class="alertsbox"></section>
  <section id="results" class="results"></section>
  <section id="skipped" class="skipped"></section>

  <details class="card fold" id="method">
    <summary><h2 data-i18n="methodTitle"></h2></summary>
    <p data-i18n="methodIntro"></p>
    <p class="formula" data-i18n="methodFormula"></p>
    <p data-i18n="methodSources"></p>
    <h3 data-i18n="generalTitle"></h3>
    <ul id="general" class="general"></ul>
    <p class="refs">
      EFLM Biological Variation Database — <a href="https://biologicalvariation.eu" rel="noopener">biologicalvariation.eu</a> ·
      Fokkema MR et al. Clin Chem 2006;52:1602–3 (log-normal RCV) ·
      Fraser CG. Clin Chem 2011;57:1635–7 (RCV) ·
      Ricos C et al. Scand J Clin Lab Invest 1999;59:491–500.
    </p>
  </details>

  <details class="card fold" id="settings">
    <summary><h2 data-i18n="settingsTitle"></h2></summary>
    <p data-i18n="settingsIntro"></p>
    <div class="tablewrap"><table id="settings-table"></table></div>
    <button type="button" id="reset" class="ghost" data-i18n="reset"></button>
  </details>
</main>

<footer><p data-i18n="footer"></p></footer>

<script src="js/analytes.js"></script>
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
